<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout Demo — Elemental</title>
  <link rel="stylesheet" href="elemental.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="demo-body">
  <header class="demo-header">
    <div class="demo-header-left">
      <a href="index.html" class="demo-back-btn">← All Layouts</a>
      <div class="demo-title-group">
        <h1>Grid <span class="demo-badge">[data-grid]</span></h1>
      </div>
    </div>
    <div class="demo-header-right">
      <select id="nav-select" class="demo-nav-select"></select>
      <button class="demo-code-toggle-btn" id="code-toggle"><span>&lt;/&gt;</span> Code</button>
      <button class="demo-theme-btn" id="theme-toggle"><span>☀️</span> Light</button>
    </div>
  </header>

  <div class="demo-layout">
    <main class="demo-stage-wrapper">
      <div class="demo-desc-bar">
        <strong>Grid</strong> uses modern CSS Grid with <code>repeat(auto-fit, minmax(min(100%, var(--min-width)), 1fr))</code> to automatically calculate responsive columns without requiring media queries.
      </div>
      
      <div class="demo-stage-container demo-stage-container-900" id="stage-box">
        <div class="demo-target-box demo-p-md">
          <div id="layout-target" data-grid="min:sm gap:md" class="demo-w-full">
            <!-- Dynamically generated grid cards -->
          </div>
        </div>
      </div>
    </main>

    <aside class="demo-controls-panel">
      <div>
        <div class="demo-section-title">Column Min-Width</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Min Width Scale</span>
            <span class="demo-control-val" id="val-min">min:sm (16rem)</span>
          </label>
          <div class="demo-btn-group" id="btn-group-min">
            <button class="demo-toggle-btn" data-val="min:xs">xs (12rem)</button>
            <button class="demo-toggle-btn active" data-val="min:sm">sm (16rem)</button>
            <button class="demo-toggle-btn" data-val="min:md">md (20rem)</button>
            <button class="demo-toggle-btn" data-val="min:lg">lg (25rem)</button>
            <button class="demo-toggle-btn" data-val="min:xl">xl (30rem)</button>
            <button class="demo-toggle-btn" data-val="custom">Custom</button>
          </div>
        </div>

        <div class="demo-control-group demo-hidden" id="group-custom-min">
          <label class="demo-control-label">
            <span>Custom --min-width</span>
            <span class="demo-control-val" id="val-custom-min">220px</span>
          </label>
          <input type="range" class="demo-input-range" id="input-custom-min" min="100" max="450" value="220">
        </div>
      </div>

      <div>
        <div class="demo-section-title">Spacing & Items</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Gap Scale Preset</span>
            <span class="demo-control-val" id="val-gap">gap:md</span>
          </label>
          <div class="demo-btn-group" id="btn-group-gap">
            <button class="demo-toggle-btn" data-val="gap:sm">sm (16px)</button>
            <button class="demo-toggle-btn active" data-val="gap:md">md (24px)</button>
            <button class="demo-toggle-btn" data-val="gap:lg">lg (40px)</button>
            <button class="demo-toggle-btn" data-val="custom">Custom</button>
          </div>
        </div>

        <div class="demo-control-group demo-hidden" id="group-custom-gap">
          <label class="demo-control-label">
            <span>Custom --grid-gap</span>
            <span class="demo-control-val" id="val-custom-gap">24px</span>
          </label>
          <input type="range" class="demo-input-range" id="input-custom-gap" min="0" max="80" value="24">
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Card Count</span>
            <span class="demo-control-val" id="val-items">6 cards</span>
          </label>
          <input type="range" class="demo-input-range" id="input-item-count" min="1" max="12" value="6">
        </div>
      </div>

      <div>
        <div class="demo-section-title">Viewport Width Tester</div>
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Container Width</span>
            <span class="demo-control-val" id="val-sim-width">900px</span>
          </label>
          <input type="range" class="demo-input-range" id="input-sim-width" min="320" max="1000" value="900">
        </div>
      </div>

      <button class="demo-reset-btn" id="btn-reset">↺ Reset to Defaults</button>
    </aside>
  </div>

  <div class="demo-code-drawer" id="code-drawer">
    <div class="demo-code-header">
      <span class="demo-code-title">HTML Output</span>
      <button class="demo-copy-btn" id="copy-code-btn"><span>📋</span> Copy HTML</button>
    </div>
    <pre class="demo-code-pre"><code id="code-display"></code></pre>
  </div>

  <script src="demo.js"></script>
  <script>
    const demo = new ElementalDemo({ layoutId: 'grid' });
    const target = document.getElementById('layout-target');
    const stageBox = document.getElementById('stage-box');

    let currentMin = 'min:sm';
    let currentGap = 'gap:md';

    function renderItems(count) {
      demo.setContainerItems(count, (i) => `
        <div class="demo-item demo-min-h-100">
          <span class="demo-item-tag">Grid #${i}</span>
          <div class="demo-item-label">Grid Cell ${i}</div>
          <div class="demo-item-sub">Auto-fit fluid grid column</div>
        </div>
      `);
    }

    function updateTarget() {
      const customMinGroup = document.getElementById('group-custom-min');
      const customGapGroup = document.getElementById('group-custom-gap');
      const attrs = [];

      if (currentMin !== 'custom') {
        attrs.push(currentMin);
        target.style.removeProperty('--min-width');
        customMinGroup.classList.add('demo-hidden');
        document.getElementById('val-min').textContent = currentMin;
      } else {
        customMinGroup.classList.remove('demo-hidden');
        const customPx = document.getElementById('input-custom-min').value;
        target.style.setProperty('--min-width', `${customPx}px`);
        document.getElementById('val-custom-min').textContent = `${customPx}px`;
        document.getElementById('val-min').textContent = `var(--min-width: ${customPx}px)`;
      }

      if (currentGap !== 'custom') {
        attrs.push(currentGap);
        target.style.removeProperty('--grid-gap');
        customGapGroup.classList.add('demo-hidden');
        document.getElementById('val-gap').textContent = currentGap;
      } else {
        customGapGroup.classList.remove('demo-hidden');
        const customPx = document.getElementById('input-custom-gap').value;
        target.style.setProperty('--grid-gap', `${customPx}px`);
        document.getElementById('val-custom-gap').textContent = `${customPx}px`;
        document.getElementById('val-gap').textContent = `var(--grid-gap: ${customPx}px)`;
      }

      target.setAttribute('data-grid', attrs.join(' '));

      demo.updateCode();
    }

    // Min buttons
    document.querySelectorAll('#btn-group-min button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-min button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMin = btn.dataset.val;
        updateTarget();
      });
    });

    // Gap buttons
    document.querySelectorAll('#btn-group-gap button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGap = btn.dataset.val;
        updateTarget();
      });
    });

    document.getElementById('input-custom-min').addEventListener('input', updateTarget);
    document.getElementById('input-custom-gap').addEventListener('input', updateTarget);

    // Item count
    document.getElementById('input-item-count').addEventListener('input', (e) => {
      const count = parseInt(e.target.value, 10);
      document.getElementById('val-items').textContent = `${count} cards`;
      renderItems(count);
      updateTarget();
    });

    // Viewport Simulator
    document.getElementById('input-sim-width').addEventListener('input', (e) => {
      const w = e.target.value;
      stageBox.style.maxWidth = `${w}px`;
      document.getElementById('val-sim-width').textContent = `${w}px`;
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      currentMin = 'min:sm';
      currentGap = 'gap:md';

      document.querySelectorAll('#btn-group-min button').forEach(b => b.classList.toggle('active', b.dataset.val === 'min:sm'));
      document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.toggle('active', b.dataset.val === 'gap:md'));

      stageBox.style.maxWidth = '900px';
      document.getElementById('input-sim-width').value = 900;
      document.getElementById('val-sim-width').textContent = '900px';

      document.getElementById('input-item-count').value = 6;
      document.getElementById('val-items').textContent = '6 cards';
      renderItems(6);

      updateTarget();
    });

    renderItems(6);
    updateTarget();
  </script>
</body>
</html>
