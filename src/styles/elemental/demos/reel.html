<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Layout Demo — Elemental</title>
  <link rel="stylesheet" href="elemental.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="demo-body">
  <header class="demo-header">
    <div class="demo-header-left">
      <a href="index.html" class="demo-back-btn">← All Layouts</a>
      <div class="demo-title-group">
        <h1>Reel <span class="demo-badge">[data-reel]</span></h1>
      </div>
    </div>
    <div class="demo-header-right">
      <select id="nav-select" class="demo-nav-select"></select>
      <button class="demo-code-toggle-btn" id="code-toggle"><span>&lt;/&gt;</span> Code</button>
      <button class="demo-theme-btn" id="theme-toggle"><span>☀️</span> Light</button>
    </div>
  </header>

  <div class="demo-layout">
    <main class="demo-stage-wrapper">
      <div class="demo-desc-bar">
        <strong>Reel</strong> creates a smooth horizontal scroll gallery with CSS scroll-snapping (<code>snap:start|center|end</code>) and precise visible item counts (<code>items:2|3|4|5</code>).
      </div>
      
      <div class="demo-stage-container demo-stage-container-850">
        <div class="demo-target-box demo-p-sm">
          <div id="layout-target" data-reel="items:3 gap:md padding:sm" class="demo-w-full">
            <!-- Dynamically generated reel cards -->
          </div>
        </div>
      </div>
    </main>

    <aside class="demo-controls-panel">
      <div>
        <div class="demo-section-title">Visible Items & Snap</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Visible Items Count</span>
            <span class="demo-control-val" id="val-items-vis">items:3</span>
          </label>
          <div class="demo-btn-group" id="btn-group-items-vis">
            <button class="demo-toggle-btn" data-val="items:2">2 items</button>
            <button class="demo-toggle-btn active" data-val="items:3">3 items</button>
            <button class="demo-toggle-btn" data-val="items:4">4 items</button>
            <button class="demo-toggle-btn" data-val="items:5">5 items</button>
          </div>
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Scroll Snap Align</span>
            <span class="demo-control-val" id="val-snap">snap:start</span>
          </label>
          <div class="demo-btn-group" id="btn-group-snap">
            <button class="demo-toggle-btn active" data-val="">start (default)</button>
            <button class="demo-toggle-btn" data-val="snap:center">center</button>
            <button class="demo-toggle-btn" data-val="snap:end">end</button>
          </div>
        </div>
      </div>

      <div>
        <div class="demo-section-title">Spacing & Track Items</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Gap Scale Preset</span>
            <span class="demo-control-val" id="val-gap">gap:md</span>
          </label>
          <div class="demo-btn-group" id="btn-group-gap">
            <button class="demo-toggle-btn" data-val="gap:sm">sm (12px)</button>
            <button class="demo-toggle-btn active" data-val="gap:md">md (16px)</button>
            <button class="demo-toggle-btn" data-val="gap:lg">lg (24px)</button>
            <button class="demo-toggle-btn" data-val="custom">Custom</button>
          </div>
        </div>

        <div class="demo-control-group demo-hidden" id="group-custom-gap">
          <label class="demo-control-label">
            <span>Custom --reel-gap</span>
            <span class="demo-control-val" id="val-custom-gap">16px</span>
          </label>
          <input type="range" class="demo-input-range" id="input-custom-gap" min="0" max="64" value="16">
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Padding Scale</span>
            <span class="demo-control-val" id="val-padding">padding:sm</span>
          </label>
          <div class="demo-btn-group" id="btn-group-padding">
            <button class="demo-toggle-btn" data-val="">none</button>
            <button class="demo-toggle-btn active" data-val="padding:sm">sm</button>
            <button class="demo-toggle-btn" data-val="padding:md">md</button>
            <button class="demo-toggle-btn" data-val="padding:lg">lg</button>
          </div>
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Total Cards in Reel</span>
            <span class="demo-control-val" id="val-total-items">8 cards</span>
          </label>
          <input type="range" class="demo-input-range" id="input-total-items" min="4" max="16" value="8">
        </div>
      </div>

      <button class="demo-reset-btn" id="btn-reset">↺ Reset to Defaults</button>
    </aside>
  </div>

  <div class="demo-code-drawer" id="code-drawer">
    <div class="demo-code-header">
      <span class="demo-code-title">HTML Output</span>
      <button class="demo-copy-btn" id="copy-code-btn"><span>📋</span> Copy HTML</button>
    </div>
    <pre class="demo-code-pre"><code id="code-display"></code></pre>
  </div>

  <script src="demo.js"></script>
  <script>
    const demo = new ElementalDemo({ layoutId: 'reel' });
    const target = document.getElementById('layout-target');

    let currentItemsVis = 'items:3';
    let currentSnap = '';
    let currentGap = 'gap:md';
    let currentPadding = 'padding:sm';

    function renderItems(count) {
      demo.setContainerItems(count, (i) => `
        <div class="demo-item demo-reel-card-inner">
          <div>
            <span class="demo-item-tag">Slide ${i}</span>
            <div class="demo-item-label">Gallery Card ${i}</div>
            <div class="demo-item-sub">Scroll horizontally to snap</div>
          </div>
          <div class="demo-reel-card-arrow">
            Card #${i} →
          </div>
        </div>
      `);
    }

    function updateTarget() {
      const customGroup = document.getElementById('group-custom-gap');
      const attrs = [currentItemsVis, currentSnap, currentPadding];

      if (currentGap !== 'custom') {
        attrs.push(currentGap);
        target.style.removeProperty('--reel-gap');
        customGroup.classList.add('demo-hidden');
        document.getElementById('val-gap').textContent = currentGap;
      } else {
        customGroup.classList.remove('demo-hidden');
        const customPx = document.getElementById('input-custom-gap').value;
        target.style.setProperty('--reel-gap', `${customPx}px`);
        document.getElementById('val-custom-gap').textContent = `${customPx}px`;
        document.getElementById('val-gap').textContent = `var(--reel-gap: ${customPx}px)`;
      }

      target.setAttribute('data-reel', attrs.filter(Boolean).join(' '));

      document.getElementById('val-items-vis').textContent = currentItemsVis;
      document.getElementById('val-snap').textContent = currentSnap || 'start (default)';
      document.getElementById('val-padding').textContent = currentPadding || 'none';

      demo.updateCode();
    }

    // Items visible buttons
    document.querySelectorAll('#btn-group-items-vis button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-items-vis button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentItemsVis = btn.dataset.val;
        updateTarget();
      });
    });

    // Snap buttons
    document.querySelectorAll('#btn-group-snap button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-snap button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSnap = btn.dataset.val;
        updateTarget();
      });
    });

    // Gap buttons
    document.querySelectorAll('#btn-group-gap button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGap = btn.dataset.val;
        updateTarget();
      });
    });

    // Padding buttons
    document.querySelectorAll('#btn-group-padding button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-padding button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPadding = btn.dataset.val;
        updateTarget();
      });
    });

    document.getElementById('input-custom-gap').addEventListener('input', updateTarget);

    // Item count
    document.getElementById('input-total-items').addEventListener('input', (e) => {
      const count = parseInt(e.target.value, 10);
      document.getElementById('val-total-items').textContent = `${count} cards`;
      renderItems(count);
      updateTarget();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      currentItemsVis = 'items:3';
      currentSnap = '';
      currentGap = 'gap:md';
      currentPadding = 'padding:sm';

      document.querySelectorAll('#btn-group-items-vis button').forEach(b => b.classList.toggle('active', b.dataset.val === 'items:3'));
      document.querySelectorAll('#btn-group-snap button').forEach(b => b.classList.toggle('active', b.dataset.val === ''));
      document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.toggle('active', b.dataset.val === 'gap:md'));
      document.querySelectorAll('#btn-group-padding button').forEach(b => b.classList.toggle('active', b.dataset.val === 'padding:sm'));

      document.getElementById('input-total-items').value = 8;
      document.getElementById('val-total-items').textContent = '8 cards';
      renderItems(8);

      updateTarget();
    });

    renderItems(8);
    updateTarget();
  </script>
</body>
</html>
