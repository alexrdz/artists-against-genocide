<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Row Layout Demo — Elemental</title>
  <link rel="stylesheet" href="elemental.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="demo-body">
  <header class="demo-header">
    <div class="demo-header-left">
      <a href="index.html" class="demo-back-btn">← All Layouts</a>
      <div class="demo-title-group">
        <h1>Row <span class="demo-badge">[data-row]</span></h1>
      </div>
    </div>
    <div class="demo-header-right">
      <select id="nav-select" class="demo-nav-select"></select>
      <button class="demo-code-toggle-btn" id="code-toggle"><span>&lt;/&gt;</span> Code</button>
      <button class="demo-theme-btn" id="theme-toggle"><span>☀️</span> Light</button>
    </div>
  </header>

  <div class="demo-layout">
    <main class="demo-stage-wrapper">
      <div class="demo-desc-bar">
        <strong>Row</strong> provides flex-based equal or fractional column systems (<code>col:2</code>, <code>col:3</code>) with automatic wrapping based on min column widths (<code>col-size:*</code>).
      </div>
      
      <div class="demo-stage-container demo-stage-container-900">
        <div class="demo-target-box demo-p-md">
          <div id="layout-target" data-row="col:3 gap:md col-size:sm" class="demo-w-full">
            <!-- Dynamically generated row items -->
          </div>
        </div>
      </div>
    </main>

    <aside class="demo-controls-panel">
      <div>
        <div class="demo-section-title">Column Setup</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Columns</span>
            <span class="demo-control-val" id="val-col">col:3</span>
          </label>
          <div class="demo-btn-group" id="btn-group-col">
            <button class="demo-toggle-btn" data-val="">auto</button>
            <button class="demo-toggle-btn" data-val="col:2">col:2 (50%)</button>
            <button class="demo-toggle-btn active" data-val="col:3">col:3 (33.3%)</button>
          </div>
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Minimum Col Width</span>
            <span class="demo-control-val" id="val-col-size">col-size:sm</span>
          </label>
          <div class="demo-btn-group" id="btn-group-col-size">
            <button class="demo-toggle-btn active" data-val="col-size:sm">sm (12.5rem)</button>
            <button class="demo-toggle-btn" data-val="col-size:md">md (25rem)</button>
            <button class="demo-toggle-btn" data-val="col-size:lg">lg (37.5rem)</button>
          </div>
        </div>
      </div>

      <div>
        <div class="demo-section-title">Spacing & Items</div>
        
        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Gap Scale Preset</span>
            <span class="demo-control-val" id="val-gap">gap:md</span>
          </label>
          <div class="demo-btn-group" id="btn-group-gap">
            <button class="demo-toggle-btn" data-val="gap:sm">sm (16px)</button>
            <button class="demo-toggle-btn active" data-val="gap:md">md (32px)</button>
            <button class="demo-toggle-btn" data-val="gap:lg">lg (48px)</button>
            <button class="demo-toggle-btn" data-val="custom">Custom</button>
          </div>
        </div>

        <div class="demo-control-group demo-hidden" id="group-custom-gap">
          <label class="demo-control-label">
            <span>Custom --row-gap</span>
            <span class="demo-control-val" id="val-custom-gap">32px</span>
          </label>
          <input type="range" class="demo-input-range" id="input-custom-gap" min="0" max="80" value="32">
        </div>

        <div class="demo-control-group">
          <label class="demo-control-label">
            <span>Item Count</span>
            <span class="demo-control-val" id="val-items">6 cards</span>
          </label>
          <input type="range" class="demo-input-range" id="input-item-count" min="2" max="12" value="6">
        </div>
      </div>

      <button class="demo-reset-btn" id="btn-reset">↺ Reset to Defaults</button>
    </aside>
  </div>

  <div class="demo-code-drawer" id="code-drawer">
    <div class="demo-code-header">
      <span class="demo-code-title">HTML Output</span>
      <button class="demo-copy-btn" id="copy-code-btn"><span>📋</span> Copy HTML</button>
    </div>
    <pre class="demo-code-pre"><code id="code-display"></code></pre>
  </div>

  <script src="demo.js"></script>
  <script>
    const demo = new ElementalDemo({ layoutId: 'row' });
    const target = document.getElementById('layout-target');

    let currentCol = 'col:3';
    let currentColSize = 'col-size:sm';
    let currentGap = 'gap:md';

    function renderItems(count) {
      demo.setContainerItems(count, (i) => `
        <div class="demo-item">
          <span class="demo-item-tag">Col ${i}</span>
          <div class="demo-item-label">Row Element ${i}</div>
          <div class="demo-item-sub">Flex-basis bounded column item</div>
        </div>
      `);
    }

    function updateTarget() {
      const customGroup = document.getElementById('group-custom-gap');
      const attrs = [currentCol, currentColSize];

      if (currentGap !== 'custom') {
        attrs.push(currentGap);
        target.style.removeProperty('--row-gap');
        customGroup.classList.add('demo-hidden');
        document.getElementById('val-gap').textContent = currentGap;
      } else {
        customGroup.classList.remove('demo-hidden');
        const customPx = document.getElementById('input-custom-gap').value;
        target.style.setProperty('--row-gap', `${customPx}px`);
        document.getElementById('val-custom-gap').textContent = `${customPx}px`;
        document.getElementById('val-gap').textContent = `var(--row-gap: ${customPx}px)`;
      }

      target.setAttribute('data-row', attrs.filter(Boolean).join(' '));

      document.getElementById('val-col').textContent = currentCol || 'auto';
      document.getElementById('val-col-size').textContent = currentColSize;

      demo.updateCode();
    }

    // Col buttons
    document.querySelectorAll('#btn-group-col button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-col button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCol = btn.dataset.val;
        updateTarget();
      });
    });

    // Col size buttons
    document.querySelectorAll('#btn-group-col-size button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-col-size button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColSize = btn.dataset.val;
        updateTarget();
      });
    });

    // Gap buttons
    document.querySelectorAll('#btn-group-gap button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGap = btn.dataset.val;
        updateTarget();
      });
    });

    document.getElementById('input-custom-gap').addEventListener('input', updateTarget);

    // Item count
    document.getElementById('input-item-count').addEventListener('input', (e) => {
      const count = parseInt(e.target.value, 10);
      document.getElementById('val-items').textContent = `${count} cards`;
      renderItems(count);
      updateTarget();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      currentCol = 'col:3';
      currentColSize = 'col-size:sm';
      currentGap = 'gap:md';

      document.querySelectorAll('#btn-group-col button').forEach(b => b.classList.toggle('active', b.dataset.val === 'col:3'));
      document.querySelectorAll('#btn-group-col-size button').forEach(b => b.classList.toggle('active', b.dataset.val === 'col-size:sm'));
      document.querySelectorAll('#btn-group-gap button').forEach(b => b.classList.toggle('active', b.dataset.val === 'gap:md'));

      document.getElementById('input-item-count').value = 6;
      document.getElementById('val-items').textContent = '6 cards';
      renderItems(6);

      updateTarget();
    });

    renderItems(6);
    updateTarget();
  </script>
</body>
</html>
